<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바보야 문제는 너야</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#15803d;--bad:#dc2626;--soft:#eef2ff;--me:#dbeafe}
@media (prefers-color-scheme: dark){:root{--bg:#111318;--card:#1b1e26;--text:#e8eaf0;--muted:#9aa1ad;--line:#2b303b;--accent:#3b82f6;--ok:#4ade80;--bad:#f87171;--soft:#1e2740;--me:#1e3a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font-size:20px;margin:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}
button,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
button.on,button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.en{font-size:18px;font-weight:600}
.ko{color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.result{margin-top:8px}
.trans{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:15px}
.w-ok{color:var(--ok)}
.w-miss{color:var(--bad);text-decoration:underline}
.pass{color:var(--ok);font-weight:700}
.fail{color:var(--bad);font-weight:700}
.count{font-weight:600;margin-bottom:10px}
.scene{text-align:center;font-weight:700;margin:16px 0 8px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 40px 6px 0}
.bubble.me{background:var(--me);border-color:transparent;margin:6px 0 6px 40px;text-align:right}
.optrow{display:flex;gap:6px;margin-top:6px}
.opt{flex:1;text-align:left;background:var(--soft)}
#rpmsg{color:var(--bad);margin-top:8px;font-size:14px}
#warn{display:none;background:#fef3c7;color:#92400e;border-radius:8px;padding:10px;margin-bottom:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>🐕💬 바보야 문제는 너야</h1>
    <div class="ctrl">
      <label>난이도
        <select id="level">
          <option value="easy">초급</option>
          <option value="mid">중급</option>
          <option value="hard">고급</option>
        </select>
      </label>
      <label><input type="checkbox" id="slow"> 🐢 느리게</label>
    </div>
  </header>
  <p class="hint" id="levelHint"></p>
  <div id="warn">이 브라우저는 음성 인식을 지원하지 않아요. <b>크롬</b>이나 <b>엣지</b>로 열어 주세요. (듣기는 가능)</div>
  <div class="tabs">
    <button id="tabDaily" class="on">📅 오늘의 문장</button>
    <button id="tabStory">🎭 롤플레이</button>
    <button id="tabNews">📰 오늘의 뉴스</button>
  </div>

  <section id="daily">
    <label>문장 종류
      <select id="kind">
        <option value="mid">중급</option>
        <option value="hard">고급</option>
        <option value="travel">✈️ 여행</option>
        <option value="mz">🔥 MZ 표현</option>
      </select>
    </label>
    <button id="dailyNew">🔄 새 문장</button>
    <p class="hint" id="dailySrc"></p>
    <div class="count" id="count"></div>
    <div id="cards"></div>
  </section>

  <section id="story" hidden>
    <label>상황 <select id="storyPick"></select></label>
    <div id="log"></div>
    <div class="card" id="choices"></div>
  </section>

  <section id="news" hidden>
    <div class="row">
      <select id="section">
        <option value="HomePage">주요 뉴스</option>
        <option value="World">세계</option>
        <option value="Business">비즈니스</option>
        <option value="Technology">기술</option>
        <option value="Arts">문화·예술</option>
        <option value="Science">과학</option>
        <option value="Health">건강</option>
      </select>
      <button class="primary" id="newsLoad">새로고침</button>
    </div>
    <p class="hint" id="newsMsg"></p>
    <div id="newsCards"></div>
    <p class="hint">출처: The New York Times RSS</p>
  </section>
</main>

// 위쪽 난이도는 롤플레이와 뉴스에만 쓴다 (오늘의 문장은 '문장 종류'로 고름)
const LEVEL_HINT = {
  easy: "초급: 롤플레이 보기를 영어+한국어로 보여 주고, 뉴스는 짧은 제목으로 연습해요.",
  mid: "중급: 롤플레이 보기는 영어만, 상대 말 해석은 접어 둬요. 뉴스는 요약문으로 연습해요.",
  hard: "고급: 롤플레이 보기는 한국어만 보여 줘요. 영어로 직접 말해 보세요. 뉴스는 요약문으로 연습해요.",
};
const PASS = 80; // 통과 기준 %
const MATCH = 0.5; // 롤플레이 보기와 이만큼 비슷하면 그 보기로 인정

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// ---------- 문장 비교 ----------
const NUM = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
// shortcut: 숫자는 0~12만 영어 단어로 바꾼다. 큰 숫자가 든 문장을 넣으면 그때 늘릴 것
function words(s) {
  // normalize+replace: café → cafe 처럼 악센트를 뗀다
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’‘]/g, "").replace(/[^a-z0-9]+/g, " ").split(" ").filter(Boolean)
    .map(w => /^\d+$/.test(w) && NUM[w] ? NUM[w] : w);
}
// a의 각 단어가 b와의 최장 공통 부분열에 들어가는지 표시
function lcsHits(a, b) {
  const d = Array.from({length: a.length + 1}, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
  const hit = new Array(a.length).fill(false);
  for (let i = 0, j = 0; i < a.length && j < b.length;) {
    if (a[i] === b[j]) { hit[i] = true; i++; j++; }
    else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++;
  }
  return hit;
}
function grade(target, heard) {
  const tokens = target.split(" "), t = [], owner = [];
  tokens.forEach((tok, i) => words(tok).forEach(w => { t.push(w); owner.push(i); }));
  const hit = lcsHits(t, words(heard));
  const tokOk = tokens.map((_, i) => owner.every((o, k) => o !== i || hit[k]));
  return {tokens, tokOk, pct: Math.round(100 * hit.filter(Boolean).length / t.length)};
}
function similarity(a, b) {
  const x = words(a), y = words(b);
  return x.length + y.length ? 2 * lcsHits(x, y).filter(Boolean).length / (x.length + y.length) : 0;
}

// ---------- 소리 ----------
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = $("#slow").checked ? 0.7 : 1;
  const v = speechSynthesis.getVoices().find(v => /^en[-_]US/.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let listening = false;
// onText에는 인식 후보 문장 배열이 온다. 못 들었으면 빈 배열
function listen(onText, btn) {
  if (!SR) { alert("이 브라우저는 음성 인식을 지원하지 않아요. 크롬이나 엣지에서 열어 주세요."); return; }
  if (listening) return;
  speechSynthesis.cancel();
  const r = new SR();
  r.lang = "en-US"; r.maxAlternatives = 3; r.interimResults = false;
  const label = btn.textContent;
  let got = null;
  listening = true; btn.textContent = "🔴 듣는 중..."; btn.disabled = true;
  r.onresult = e => { got = [...e.results[0]].map(a => a.transcript); };
  r.onerror = e => {
    if (e.error === "not-allowed") alert("마이크 권한을 허용해 주세요.");
    else if (e.error === "network") alert("인터넷 연결이 필요해요.");
  };
  r.onend = () => { listening = false; btn.textContent = label; btn.disabled = false; onText(got || []); };
  r.start();
}

// ---------- 오늘의 문장 ----------
function todays(list) {
  const d = new Date();
  let seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  const rand = () => { seed = seed * 16807 % 2147483647; return seed / 2147483647; };
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, 10);
}
let passed = new Set();
function updateCount() { $("#count").textContent = `오늘 통과: ${passed.size} / 10`; }
// 듣기 + 따라 말하기 카드. sub는 문장 아래에 붙는 HTML
function practiceCard(label, en, sub, onPass = () => {}) {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `<div class="en">${label}${esc(en)}</div>${sub}
    <div class="row"><button>🔊 듣기</button><button class="primary">🎤 따라 말하기</button></div><div class="result"></div>`;
  const [play, mic] = c.querySelectorAll(".row button"), res = c.querySelector(".result");
  play.onclick = () => speak(en);
  mic.onclick = () => listen(alts => {
    if (!alts.length) { res.textContent = "소리를 못 들었어요. 다시 해 보세요."; return; }
    const best = alts.map(a => ({a, g: grade(en, a)})).sort((x, y) => y.g.pct - x.g.pct)[0];
    const ok = best.g.pct >= PASS;
    if (ok) onPass();
    res.innerHTML = `<span class="${ok ? "pass" : "fail"}">${best.g.pct}% ${ok ? "통과!" : "다시 도전"}</span><br>`
      + best.g.tokens.map((t, k) => `<span class="${best.g.tokOk[k] ? "w-ok" : "w-miss"}">${esc(t)}</span>`).join(" ")
      + `<div class="ko">들린 말: ${esc(best.a)}</div>`;
  }, mic);
  return c;
}
// 인터넷 문장: Tatoeba(무료 공개 예문, 한국어 번역 포함, 키 필요 없음). MZ 슬랭은 믿을 만한 무료 출처가 없어 내장 목록만 쓴다
const ONLINE = {
  mid: "&word_count=6-10",
  hard: "&word_count=11-",
  travel: "&q=" + encodeURIComponent("hotel|airport|ticket|passport|restaurant|taxi|train|station|bus|flight|luggage|baggage|reservation|menu|museum|subway|souvenir|travel|trip|tour"),
};
async function onlineSentences(kind) {
  const r = await fetch("https://api.tatoeba.org/unstable/sentences?lang=eng&trans:lang=kor&sort=random&limit=40" + ONLINE[kind]);
  if (!r.ok) throw new Error("Tatoeba " + r.status);
  return (await r.json()).data
    .filter(d => !d.is_unapproved)
    .map(d => [d.text, ((d.translations || []).flat().find(t => t.lang === "kor") || {}).text])
    .filter(([en, ko]) => en && ko)
    .slice(0, 10);
}
// fresh: 🔄 새 문장을 눌렀을 때. 내장 목록(MZ)은 오늘 순서 대신 무작위로 섞는다
async function renderDaily(fresh = false) {
  const kind = $("#kind").value, today = new Date().toDateString(), cacheKey = `daily:${today}:${kind}`;
  passed = new Set(); updateCount();
  let list = null;
  if (ONLINE[kind]) {
    $("#dailySrc").textContent = "인터넷에서 오늘의 문장을 가져오는 중...";
    try { list = JSON.parse(localStorage.getItem(cacheKey)); } catch (e) {}
    if (!list) {
      try {
        list = await onlineSentences(kind);
        try {
          Object.keys(localStorage).filter(k => k.startsWith("daily:") && !k.startsWith(`daily:${today}:`)).forEach(k => localStorage.removeItem(k));
          localStorage.setItem(cacheKey, JSON.stringify(list)); // 같은 날 다시 열어도 같은 문장
        } catch (e) {}
      } catch (e) { list = null; }
    }
    if (kind !== $("#kind").value) return; // 기다리는 사이 다른 종류를 골랐으면 버린다
  }
  $("#dailySrc").innerHTML = !ONLINE[kind] ? "내장 표현 목록 (날짜마다 10개씩 바뀌어요)"
    : list ? `출처: <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> 공개 예문 (CC BY 2.0 FR) · 매일 새 문장`
    : "인터넷에 연결되지 않아 내장 문장을 보여 줘요.";
  const builtin = fresh ? SENTENCES[kind].slice().sort(() => Math.random() - 0.5) : todays(SENTENCES[kind]);
  if (!list || list.length < 10) list = (list || []).concat(builtin).slice(0, 10); // 모자라면 내장 문장으로 채움
  const box = $("#cards"); box.innerHTML = "";
  list.forEach(([en, ko], i) =>
    box.append(practiceCard(`${i + 1}. `, en, `<div class="ko">${esc(ko)}</div>`, () => { passed.add(i); updateCount(); })));
}
$("#dailyNew").onclick = () => {
  try { localStorage.removeItem(`daily:${new Date().toDateString()}:${$("#kind").value}`); } catch (e) {}
  renderDaily(true);
};

// ---------- 오늘의 뉴스 (NYT RSS, 키 필요 없음) ----------
// shortcut: NYT RSS가 브라우저 직접 호출을 허용해서 서버 없이 된다. 막히면 중간 서버가 필요
try { localStorage.removeItem("nytKey"); } catch (e) {} // 예전 버전에서 저장한 API 키 정리
let news = null; // 마지막으로 불러온 기사 목록
async function loadNews() {
  $("#newsMsg").textContent = "불러오는 중...";
  try {
    const sec = $("#section").value;
    const r = await fetch(`https://rss.nytimes.com/services/xml/rss/nyt/${sec}.xml`);
    if (!r.ok) throw new Error(`NYT 서버 오류 (${r.status}). 잠시 후 다시 해 보세요.`);
    const xml = await r.text();
    if (sec !== $("#section").value) return; // 그새 다른 분야를 골랐으면 늦게 온 응답은 버린다
    const doc = new DOMParser().parseFromString(xml, "text/xml");
    const text = (item, tag) => (item.querySelector(tag)?.textContent || "").trim();
    news = [...doc.querySelectorAll("item")]
      .map(i => ({title: text(i, "title"), abstract: text(i, "description"), url: text(i, "link")}))
      .filter(a => a.title && a.abstract && /^https:\/\//.test(a.url))
      .slice(0, 10);
    $("#newsMsg").textContent = news.length ? "" : "기사를 찾지 못했어요. 다른 분야를 골라 보세요.";
    renderNews();
  } catch (e) {
    $("#newsMsg").textContent = e instanceof TypeError ? "인터넷 연결을 확인해 주세요." : e.message;
  }
}
// 크롬 내장 번역기(기기 안에서 번역)를 먼저 쓰고, 없으면 키 없는 무료 번역(MyMemory, 하루 글자 수 제한)을 쓴다
const transCache = new Map();
const EN_KO = {sourceLanguage: "en", targetLanguage: "ko"};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error("timeout")), ms))]);
let builtinTranslator = null; // null: 아직 모름, false: 이번에는 못 씀
async function translate(text) {
  if (transCache.has(text)) return transCache.get(text);
  let ko = null;
  if ("Translator" in self && builtinTranslator !== false) {
    try {
      // 번역 모델을 이미 받아 둔 경우에만 쓴다. 받기 전이면 응답 없이 멈출 수 있어서 바로 무료 번역으로 넘어감
      builtinTranslator ??= withTimeout(Translator.availability(EN_KO), 3000)
        .then(a => a === "available" ? Translator.create(EN_KO) : Promise.reject(new Error(a)));
      ko = await withTimeout((await withTimeout(builtinTranslator, 5000)).translate(text), 5000);
    } catch (e) { builtinTranslator = false; }
  }
  const myMemory = async q => {
    const j = await (await fetch("https://api.mymemory.translated.net/get?langpair=en|ko&q=" + encodeURIComponent(q))).json();
    if (j.responseStatus != 200) throw new Error("오늘 무료 번역 한도를 다 썼어요. 내일 다시 해 보세요.");
    return new DOMParser().parseFromString(j.responseData.translatedText, "text/html").documentElement.textContent; // &#39; 같은 문자 풀기
  };
  if (ko == null) {
    ko = await myMemory(text);
    if (ko.trim() === text.trim()) ko = await myMemory(text.toLowerCase()); // 대문자 많은 제목은 가끔 원문 그대로 돌려줘서 한 번 더
  }
  transCache.set(text, ko);
  return ko;
}
// 초급은 짧은 제목, 중급·고급은 요약문으로 따라 말하기
function renderNews() {
  const box = $("#newsCards"); box.innerHTML = "";
  if (!news) return;
  const easy = $("#level").value === "easy";
  news.forEach((a, i) => {
    const c = practiceCard(`${i + 1}. `, easy ? a.title : a.abstract,
      `<div class="ko">${esc(easy ? a.abstract : a.title)} · <a href="${esc(a.url)}" target="_blank" rel="noopener">NYT에서 읽기</a></div>`);
    const btn = document.createElement("button"), out = document.createElement("div");
    btn.textContent = "🇰🇷 해석 보기";
    out.className = "trans"; out.hidden = true;
    c.querySelector(".row").append(btn);
    c.querySelector(".result").before(out);
    let done = false;
    btn.onclick = async () => {
      if (done) { out.hidden = !out.hidden; btn.textContent = out.hidden ? "🇰🇷 해석 보기" : "🇰🇷 해석 숨기기"; return; }
      btn.disabled = true; out.hidden = false; out.textContent = "번역 중...";
      try {
        const [t, s] = await Promise.all([translate(a.title), translate(a.abstract)]);
        out.innerHTML = `<b>${esc(t)}</b><br>${esc(s)}`;
        done = true; btn.textContent = "🇰🇷 해석 숨기기";
      } catch (e) {
        out.textContent = e instanceof TypeError ? "인터넷 연결을 확인해 주세요." : e.message;
      }
      btn.disabled = false;
    };
    box.append(c);
  });
}
$("#newsLoad").onclick = loadNews;
$("#section").onchange = loadNews;

// ---------- 롤플레이 ----------
let node = "start", log = [], reveal = false;
function startStory() { node = "start"; log = []; showNode(); }
function showNode() {
  const n = STORY[node];
  if (n.scene) log.push({scene: n.scene});
  log.push({who: n.who, en: n.en, ko: n.ko});
  reveal = false;
  renderStory();
  speak(n.en);
}
function choose(i, heard) {
  const o = STORY[node].opts[i];
  log.push({me: true, en: heard || o[0]});
  node = o[2];
  showNode();
}
function renderStory(msg = "") {
  const n = STORY[node], lv = $("#level").value;
  $("#log").innerHTML = log.map(m =>
    m.scene ? `<div class="scene">${m.scene}</div>`
    : m.me ? `<div class="bubble me">${esc(m.en)}</div>`
    : `<div class="bubble"><b>${m.who}</b><br>${esc(m.en)}`
      + (lv === "easy" ? `<div class="ko">${m.ko}</div>` : `<details><summary>해석</summary><div class="ko">${m.ko}</div></details>`)
      + `</div>`).join("");
  const box = $("#choices");
  if (n.end) {
    box.innerHTML = `<button class="primary">🔁 처음부터 다시</button>`;
    box.querySelector("button").onclick = startStory;
  } else {
    const showEn = lv !== "hard" || reveal, showKo = lv !== "mid" || reveal;
    box.innerHTML = `<div class="ko">이렇게 말해 보세요 (눌러서 고를 수도 있어요)</div>`
      + n.opts.map(o => `<div class="optrow"><button class="opt">${showEn ? `<b>${esc(o[0])}</b>` : ""}${showEn && showKo ? "<br>" : ""}${showKo ? `<span class="ko">${o[1]}</span>` : ""}</button>`
        + (showEn ? `<button class="say" aria-label="발음 듣기">🔊</button>` : "") + `</div>`).join("")
      + `<div class="row"><button class="primary" id="rpMic">🎤 말하기</button>`
      + (showEn && showKo ? "" : `<button id="rpReveal">💡 정답 보기</button>`)
      + `<button id="rpPlay">🔊 다시 듣기</button><button id="rpReset">🔁 처음부터</button></div>
      <div id="rpmsg">${esc(msg)}</div>`;
    box.querySelectorAll(".opt").forEach((b, i) => b.onclick = () => choose(i));
    box.querySelectorAll(".say").forEach((b, i) => b.onclick = () => speak(n.opts[i][0]));
    if ($("#rpReveal")) $("#rpReveal").onclick = () => { reveal = true; renderStory(); };
    $("#rpPlay").onclick = () => speak(n.en);
    $("#rpReset").onclick = startStory;
    $("#rpMic").onclick = () => listen(alts => {
      let best = {s: 0};
      alts.forEach(a => n.opts.forEach((o, i) => { const s = similarity(o[0], a); if (s > best.s) best = {s, i, a}; }));
      if (best.s >= MATCH) return choose(best.i, best.a);
      reveal = true;
      speak("Sorry?");
      renderStory(alts.length ? `"${alts[0]}" — 잘 못 알아들었대요. 보기 중 하나로 다시 말해 보세요.` : "소리를 못 들었어요. 다시 해 보세요.");
    }, $("#rpMic"));
  }
  box.scrollIntoView({block: "nearest"});
}

// ---------- 화면 연결 ----------
function setLevel(lv) {
  try { localStorage.setItem("level", lv); } catch (e) {}
  $("#levelHint").textContent = LEVEL_HINT[lv];
  if (log.length) renderStory();
  renderNews();
}
function tab(which) {
  for (const t of ["daily", "story", "news"]) {
    $("#" + t).hidden = which !== t;
    $("#tab" + t[0].toUpperCase() + t.slice(1)).classList.toggle("on", which === t);
  }
  if (which === "story" && !log.length) startStory();
  if (which === "news" && !news) loadNews();
}
$("#tabDaily").onclick = () => tab("daily");
$("#tabStory").onclick = () => tab("story");
$("#tabNews").onclick = () => tab("news");
$("#level").onchange = e => setLevel(e.target.value);
$("#storyPick").innerHTML = Object.entries(STORIES).map(([k, s]) => `<option value="${k}">${s.title}</option>`).join("");
$("#storyPick").onchange = e => { STORY = STORIES[e.target.value].nodes; startStory(); };
if (!SR) $("#warn").style.display = "block";
speechSynthesis.getVoices(); // 일부 브라우저는 목소리 목록을 미리 불러 둬야 한다

let saved = "easy";
try { saved = localStorage.getItem("level") || "easy"; } catch (e) {}
if (!LEVEL_HINT[saved]) saved = "easy";
$("#level").value = saved;
setLevel(saved);

let kind = "mid";
try { kind = localStorage.getItem("kind") || "mid"; } catch (e) {}
if (!SENTENCES[kind]) kind = "mid";
$("#kind").value = kind;
$("#kind").onchange = e => { try { localStorage.setItem("kind", e.target.value); } catch (err) {} renderDaily(); };
renderDaily();

// ---------- 자가 점검 (개발자 도구 콘솔에서 확인) ----------
(function selfTest() {
  const ok = (c, m) => console.assert(c, "selfTest 실패: " + m);
  ok(grade("I'm on my way.", "I'm on my way").pct === 100, "완전 일치");
  ok(grade("I'm on my way.", "on my way").pct === 75, "한 단어 빠짐");
  ok(grade("I'm on my way.", "on my way").tokOk.join() === "false,true,true,true", "빠진 단어 표시");
  ok(grade("You'd better double-check the reservation before we leave.", "you'd better double check the reservation before we leave").pct === 100, "하이픈");
  ok(grade("I've been learning English for two years.", "I've been learning English for 2 years").pct === 100, "숫자");
  ok(similarity("Yes, under the name Kim.", "yes under the name Kim") > similarity("No. Do you have any rooms available?", "yes under the name Kim"), "보기 고르기");
  for (const [key, {nodes}] of Object.entries(STORIES)) for (const [id, n] of Object.entries(nodes)) {
    ok(n.end || n.opts.every(o => nodes[o[2]]), `없는 다음 장면: ${key}.${id}`);
    ok(Object.values(nodes).some(m => m.opts && m.opts.some(o => o[2] === id)) || id === "start", `닿지 않는 장면: ${key}.${id}`);
  }
  console.log("selfTest 끝");
})();
